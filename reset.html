<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Reset Admin</title></head>
<body>
    <h2>Reset Admin Password</h2>
    <button onclick="resetAdmin()" style="padding:20px;font-size:18px;">Reset Admin</button>
    <p id="msg"></p>
    <script>
        async function resetAdmin() {
            localStorage.clear();
            const encoder = new TextEncoder();
            const data = encoder.encode('admin123');
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            
            const users = [{
                id: 'user-admin-default',
                username: 'admin',
                passwordHash: hash,
                role: 'admin',
                isActive: true,
                createdAt: new Date().toISOString()
            }];
            
            localStorage.setItem('ara_users', JSON.stringify(users));
            document.getElementById('msg').textContent = '✅ Done! Username: admin | Password: admin123';
            setTimeout(() => { window.location.href = '/login.html'; }, 1500);
        }
    </script>
</body>
</html>
