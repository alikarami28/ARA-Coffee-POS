<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Reset Admin</title></head>
<body style="font-family:Tahoma;padding:20px;text-align:center;direction:rtl;">
    <h2>🔧 ریست رمز مدیر</h2>
    <button onclick="resetAdmin()" style="padding:20px 40px;font-size:18px;background:#8B4513;color:#fff;border:none;border-radius:10px;cursor:pointer;">ریست مدیر</button>
    <div id="result" style="margin-top:20px;padding:10px;background:#f5f5f5;border-radius:8px;"></div>
    <script>
        async function resetAdmin() {
            const encoder = new TextEncoder();
            const data = encoder.encode('admin123' + 'ARA_Coffee_Salt_2026');
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            
            let users = JSON.parse(localStorage.getItem('ara_users') || '[]');
            const adminIndex = users.findIndex(u => u.role === 'admin');
            
            if (adminIndex >= 0) {
                users[adminIndex].passwordHash = hash;
            } else {
                users.push({ id: 'user-admin-default', username: 'admin', passwordHash: hash, role: 'admin', isActive: true, createdAt: new Date().toISOString() });
            }
            
            localStorage.setItem('ara_users', JSON.stringify(users));
            localStorage.removeItem('ara_session');
            
            document.getElementById('result').innerHTML = `
                <p style="color:green;font-weight:bold;">✅ مدیر ریست شد!</p>
                <p><strong>Username:</strong> admin</p>
                <p><strong>Password:</strong> admin123</p>
                <p><a href="./login.html" style="color:#8B4513;">برو به صفحه ورود</a></p>
            `;
        }
    </script>
</body>
</html>
