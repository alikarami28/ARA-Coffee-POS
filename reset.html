<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Reset Admin</title></head>
<body style="font-family:sans-serif;padding:20px;text-align:center;">
    <h2>🔧 Reset Admin Password</h2>
    <button onclick="doReset()" style="padding:20px 40px;font-size:18px;background:#8B4513;color:white;border:none;border-radius:10px;cursor:pointer;">Reset Admin</button>
    <div id="result" style="margin-top:20px;padding:10px;background:#f5f5f5;border-radius:8px;word-break:break-all;"></div>
    <script>
        async function doReset() {
            const encoder = new TextEncoder();
            const data = encoder.encode('admin123');
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            
            const users = [{
                id: 'user-admin-default',
                username: 'admin',
                passwordHash: hash,
                role: 'admin',
                isActive: true,
                createdAt: new Date().toISOString()
            }];
            
            localStorage.setItem('ara_users', JSON.stringify(users));
            
            document.getElementById('result').innerHTML = `
                <p style="color:green;font-weight:bold;">✅ Admin Reset Done!</p>
                <p><strong>Username:</strong> admin</p>
                <p><strong>Password:</strong> admin123</p>
                <p><strong>Hash:</strong> ${hash}</p>
                <p style="margin-top:12px;"><a href="/login.html" style="color:#8B4513;">Go to Login Page</a></p>
            `;
        }
    </script>
</body>
</html>
