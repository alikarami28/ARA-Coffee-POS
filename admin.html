<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#8B4513">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ARA Coffee ☕ - مدیریت محصولات</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="icon" type="image/png" href="/assets/images/icon-192x192.png">
    <link rel="apple-touch-icon" href="/assets/images/icon-192x192.png">
</head>
<body data-page="admin">
    <div class="side-nav-overlay" id="side-nav-overlay"></div>
    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <button class="icon-btn" id="menu-toggle" aria-label="منو" title="منو">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12h18"/><path d="M3 6h18"/><path d="M3 18h18"/>
                    </svg>
                </button>
                <div class="logo-section">
                    <img src="/assets/images/logo-placeholder.png" alt="ARA Coffee" class="logo-img"
                         onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22><rect fill=%22%238B4513%22 width=%2240%22 height=%2240%22 rx=%2220%22/><text fill=%22white%22 x=%2250%25%22 y=%2255%25%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2220%22>☕</text></svg>'">
                    <h1 class="cafe-name">ARA Coffee</h1>
                </div>
            </div>
            <div class="header-center"><span style="font-weight:600;font-size:1.1rem;">⚙️ مدیریت محصولات</span></div>
            <div class="header-right">
                <button class="theme-toggle" id="theme-toggle" title="تغییر تم" type="button"><span class="theme-icon">🌙</span></button>
                <div class="user-section">
                    <span class="user-name" id="current-user-display">کاربر</span>
                    <div class="user-avatar" id="user-avatar">A</div>
                </div>
            </div>
        </header>

        <main class="admin-main">
            <div class="admin-tabs">
                <button class="tab-btn active" data-tab="products">📦 محصولات</button>
                <button class="tab-btn" data-tab="categories">📂 دسته‌بندی‌ها</button>
                <button class="tab-btn" data-tab="users">👤 کاربران</button>
            </div>
            <div class="tab-content active" id="tab-products">
                <div class="tab-header">
                    <button class="btn-primary" id="add-product-btn">➕ افزودن محصول جدید</button>
                    <input type="text" id="product-search" class="search-input" placeholder="🔍 جستجوی محصول...">
                </div>
                <div class="products-grid-admin" id="products-list"></div>
            </div>
            <div class="tab-content" id="tab-categories">
                <div class="tab-header"><button class="btn-primary" id="add-category-btn">➕ افزودن دسته‌بندی</button></div>
                <div class="categories-grid" id="categories-list"></div>
            </div>
            <div class="tab-content" id="tab-users">
                <div class="tab-header"><button class="btn-primary" id="add-user-btn">➕ افزودن کاربر</button></div>
                <div class="users-grid" id="users-list"></div>
            </div>
        </main>

        <nav class="side-nav" id="side-nav">
            <div class="nav-header">
                <img src="/assets/images/logo-placeholder.png" alt="ARA Coffee" class="nav-logo"
                     onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22><rect fill=%22%238B4513%22 width=%2280%22 height=%2280%22 rx=%2240%22/><text fill=%22white%22 x=%2250%25%22 y=%2255%25%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2240%22>☕</text></svg>'">
                <h3>ARA Coffee ☕</h3><p class="nav-subtitle">سیستم مدیریت کافه</p>
            </div>
            <ul class="nav-links">
                <li><a href="/index.html" class="nav-link"><span>🛒</span> صندوق فروش</a></li>
                <li><a href="/orders.html" class="nav-link"><span>📋</span> تاریخچه سفارشات</a></li>
                <li><a href="/admin.html" class="nav-link active"><span>⚙️</span> مدیریت محصولات</a></li>
                <li><a href="/reports.html" class="nav-link"><span>📊</span> گزارشات</a></li>
                <li><a href="/settings.html" class="nav-link"><span>🔧</span> تنظیمات</a></li>
            </ul>
            <div class="nav-footer"><p class="version">نسخه 1.0.0</p><button class="btn-logout" id="logout-btn">🚪 خروج</button></div>
        </nav>
    </div>

    <div class="modal-overlay" id="product-modal">
        <div class="modal-box">
            <button class="modal-close" id="modal-close">✕</button>
            <h2 class="modal-title" id="modal-title">افزودن محصول جدید</h2>
            <form id="product-form" autocomplete="off">
                <input type="hidden" id="product-id">
                <div class="form-row"><label for="product-name">📝 نام محصول *</label><input type="text" id="product-name" class="form-input" required></div>
                <div class="form-row"><label for="product-category">📂 دسته‌بندی *</label><select id="product-category" class="form-input" required><option value="">انتخاب کنید...</option></select></div>
                <div class="form-row"><label for="product-price">💰 قیمت (تومان) *</label><input type="number" id="product-price" class="form-input" min="0" required></div>
                <div class="form-row"><label for="product-description">📋 توضیحات</label><textarea id="product-description" class="form-input" rows="3"></textarea></div>
                <div class="form-row"><label for="product-image">🖼️ تصویر</label><input type="file" id="product-image" class="form-input" accept="image/*"><img id="image-preview" class="image-preview" alt="پیش‌نمایش"></div>
                <div class="form-row"><label class="checkbox-label"><input type="checkbox" id="product-active" checked><span>✅ محصول فعال باشد</span></label></div>
                <button type="submit" class="btn-primary btn-block">💾 ذخیره محصول</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="user-modal">
        <div class="modal-box">
            <button class="modal-close" id="user-modal-close">✕</button>
            <h2 class="modal-title" id="user-modal-title">افزودن کاربر جدید</h2>
            <form id="user-form" autocomplete="off">
                <input type="hidden" id="user-id">
                <div class="form-row"><label for="user-username">👤 نام کاربری *</label><input type="text" id="user-username" class="form-input" required></div>
                <div class="form-row"><label for="user-password">🔒 رمز عبور *</label><input type="password" id="user-password" class="form-input" minlength="4" required></div>
                <div class="form-row"><label for="user-role">🎯 نقش کاربر</label><select id="user-role" class="form-input"><option value="cashier">صندوق‌دار</option><option value="admin">مدیر</option></select></div>
                <button type="submit" class="btn-primary btn-block">💾 ذخیره کاربر</button>
            </form>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="/js/github-db.js"></script>    <script src="/js/models.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/products.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
