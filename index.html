<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#8B4513">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>ARA Coffee ☕ - صندوق فروش</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/pos.css">
    <link rel="icon" type="image/png" href="/assets/images/icon-192x192.png">
    <link rel="apple-touch-icon" href="/assets/images/icon-192x192.png">
</head>
<body data-page="pos">
    <div class="side-nav-overlay" id="side-nav-overlay"></div>

    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <button class="icon-btn" id="menu-toggle" aria-label="منو" title="منو">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12h18"/><path d="M3 6h18"/><path d="M3 18h18"/>
                    </svg>
                </button>
                <div class="logo-section">
                    <img src="/assets/images/logo-placeholder.png" alt="ARA Coffee" class="logo-img" id="header-logo"
                         onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22><rect fill=%22%238B4513%22 width=%2240%22 height=%2240%22 rx=%2220%22/><text fill=%22white%22 x=%2250%25%22 y=%2255%25%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2220%22>☕</text></svg>'">
                    <h1 class="cafe-name">ARA Coffee</h1>
                </div>
            </div>
            <div class="header-center">
                <div class="search-box">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
                    </svg>
                    <input type="text" id="pos-search" placeholder="جستجوی سریع (F2)..." autocomplete="off">
                </div>
            </div>
            <div class="header-right">
                <button class="theme-toggle" id="theme-toggle" title="تغییر تم" type="button">
                    <span class="theme-icon">🌙</span>
                </button>
                <span class="date-time" id="current-datetime"></span>
                <div class="user-section">
                    <span class="user-name" id="current-user-display">کاربر</span>
                    <div class="user-avatar" id="user-avatar">A</div>
                </div>
            </div>
        </header>

        <main class="pos-main">
            <section class="products-section">
                <div class="category-tabs-container">
                    <div class="category-tabs" id="category-tabs"></div>
                </div>
                <div class="products-grid" id="product-grid"></div>
            </section>
            <aside class="cart-section">
                <div class="cart-header">
                    <h2>🛒 سبد خرید</h2>
                    <button class="text-btn" id="clear-cart-btn">🗑️ خالی کردن</button>
                </div>
                <div class="cart-items" id="cart-items">
                    <p class="empty-cart">سبد خرید خالی است</p>
                </div>
                <div class="cart-footer">
                    <div class="cart-summary">
                        <div class="summary-row"><span>جمع اقلام:</span><span id="subtotal-amount">۰ تومان</span></div>
                        <div class="summary-row"><span>مالیات:</span><span id="tax-amount">۰ تومان</span></div>
                        <div class="summary-row"><span>تخفیف:</span><span id="discount-amount">۰ تومان</span></div>
                        <div class="summary-row total-row"><span>💰 مبلغ قابل پرداخت:</span><span id="total-amount">۰ تومان</span></div>
                    </div>
                    <div class="payment-methods">
                        <label class="radio-label"><input type="radio" name="payment-method" value="Cash" checked><span>💵 نقدی</span></label>
                        <label class="radio-label"><input type="radio" name="payment-method" value="Card"><span>💳 کارت</span></label>
                    </div>
                    <button class="btn-primary btn-block" id="checkout-btn">💳 پرداخت و ثبت سفارش (F8)</button>
                </div>
            </aside>
        </main>

        <nav class="side-nav" id="side-nav">
            <div class="nav-header">
                <img src="/assets/images/logo-placeholder.png" alt="ARA Coffee" class="nav-logo"
                     onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22><rect fill=%22%238B4513%22 width=%2280%22 height=%2280%22 rx=%2240%22/><text fill=%22white%22 x=%2250%25%22 y=%2255%25%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2240%22>☕</text></svg>'">
                <h3>ARA Coffee ☕</h3>
                <p class="nav-subtitle">سیستم مدیریت کافه</p>
            </div>
            <ul class="nav-links">
                <li><a href="/index.html" class="nav-link active"><span>🛒</span> صندوق فروش</a></li>
                <li><a href="/orders.html" class="nav-link"><span>📋</span> تاریخچه سفارشات</a></li>
                <li><a href="/admin.html" class="nav-link"><span>⚙️</span> مدیریت محصولات</a></li>
                <li><a href="/reports.html" class="nav-link"><span>📊</span> گزارشات</a></li>
                <li><a href="/settings.html" class="nav-link"><span>🔧</span> تنظیمات</a></li>
            </ul>
            <div class="nav-footer">
                <p class="version">نسخه 1.0.0</p>
                <button class="btn-logout" id="logout-btn">🚪 خروج</button>
            </div>
        </nav>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="/js/storage.js"></script>
    <script src="/js/models.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/print.js"></script>
    <script src="/js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(reg => console.log('SW registered:', reg.scope))
                    .catch(err => console.log('SW failed:', err));
            });
        }
    </script>
</body>
</html>
