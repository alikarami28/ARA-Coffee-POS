<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8B4513">
    <title>ARA Coffee ☕ - ورود</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/assets/images/icon-192x192.png">
</head>
<body data-page="login">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">☕</div>
            <h1 class="login-title">ARA Coffee</h1>
            <p class="login-subtitle">سیستم صندوق فروشگاهی و حسابداری</p>
            <form id="login-form" autocomplete="off">
                <div class="form-group">
                    <label for="username">👤 نام کاربری</label>
                    <input type="text" id="username" class="form-input" placeholder="نام کاربری" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="password">🔒 رمز عبور</label>
                    <input type="password" id="password" class="form-input" placeholder="رمز عبور" required autocomplete="off">
                </div>
                <button type="submit" class="btn-login">ورود به سیستم</button>
                <p class="login-error" id="login-error"></p>
            </form>
            <p class="login-footer">پیش‌فرض: admin / admin123</p>
        </div>
    </div>
    <div class="toast-container" id="toast-container"></div>
    <script src="/js/storage.js"></script>
    <script src="/js/models.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
