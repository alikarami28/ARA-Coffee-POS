<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8B4513">
    <title>ARA Coffee ☕ - ورود</title>
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="/assets/images/favicon.ico">
    <link rel="apple-touch-icon" href="/assets/images/icon-192x192.png">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Inter', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2c1a10 0%, #4a3728 40%, #5D4037 70%, #3E2723 100%);
            padding: 20px;
            direction: rtl;
        }
        .login-wrapper { width: 100%; max-width: 420px; }
        .login-card {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .login-logo {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #8B4513, #D2691E);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; color: white;
            box-shadow: 0 8px 20px rgba(139, 69, 19, 0.3);
        }
        .login-title { font-size: 1.8rem; font-weight: 700; color: #3E2723; margin-bottom: 6px; }
        .login-subtitle { color: #8B7355; font-size: 0.9rem; margin-bottom: 30px; }
        .form-group { margin-bottom: 18px; text-align: right; }
        .form-group label { display: block; margin-bottom: 6px; color: #3E2723; font-weight: 600; font-size: 0.9rem; }
        .form-input {
            width: 100%; padding: 12px 16px;
            border: 2px solid #e0d5c8; border-radius: 12px;
            font-size: 1rem; font-family: inherit;
            transition: all 0.3s ease; background: #faf8f5;
            color: #3E2723; outline: none;
        }
        .form-input:focus { border-color: #8B4513; background: #fff; box-shadow: 0 0 0 4px rgba(139, 69, 19, 0.1); }
        .btn-login {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #8B4513, #A0522D);
            color: white; border: none; border-radius: 12px;
            font-size: 1.1rem; font-weight: 700; cursor: pointer;
            font-family: inherit; transition: all 0.3s ease; margin-top: 8px;
        }
        .btn-login:hover { background: linear-gradient(135deg, #6B3410, #8B4513); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(139, 69, 19, 0.4); }
        .btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        .login-error { color: #e74c3c; font-size: 0.85rem; margin-top: 12px; display: none; text-align: center; padding: 8px; background: rgba(231, 76, 60, 0.08); border-radius: 8px; }
        @media (max-width: 480px) { .login-card { padding: 30px 20px; border-radius: 16px; } .login-logo { width: 60px; height: 60px; font-size: 2rem; } .login-title { font-size: 1.5rem; } .form-input { padding: 10px 14px; } .btn-login { padding: 12px; font-size: 1rem; } }
    </style>
</head>
<body data-page="login">

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">☕</div>
            <h1 class="login-title">ARA Coffee</h1>
            <p class="login-subtitle">سیستم صندوق فروشگاهی و حسابداری</p>
            
            <form id="login-form" autocomplete="off">
                <div class="form-group">
                    <label for="username">👤 نام کاربری</label>
                    <input type="text" id="username" class="form-input" placeholder="نام کاربری" required autocomplete="off" dir="rtl">
                </div>
                
                <div class="form-group">
                    <label for="password">🔒 رمز عبور</label>
                    <input type="password" id="password" class="form-input" placeholder="رمز عبور" required autocomplete="off" dir="rtl">
                </div>
                
                <button type="submit" class="btn-login">ورود به سیستم</button>
                
                <p class="login-error" id="login-error"></p>
            </form>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script>
        // ==========================================
        // ULTRA SIMPLE LOGIN - NO HASH - JUST COMPARE
        // ==========================================
        
        (function() {
            // Check if already logged in
            const session = localStorage.getItem('ara_session');
            if (session) {
                try {
                    const data = JSON.parse(session);
                    if (new Date() < new Date(data.expiresAt)) {
                        window.location.href = '/index.html';
                        return;
                    }
                } catch(e) {}
            }
            
            // Create default user if not exists
            let users = [];
            try {
                users = JSON.parse(localStorage.getItem('ara_users') || '[]');
            } catch(e) {
                users = [];
            }
            
            if (users.length === 0) {
                users = [{
                    id: 'admin-1',
                    username: 'admin',
                    password: 'admin123',
                    role: 'admin',
                    isActive: true
                }];
                localStorage.setItem('ara_users', JSON.stringify(users));
            }
            
            // Handle form submit
            document.getElementById('login-form').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                const errorEl = document.getElementById('login-error');
                
                errorEl.style.display = 'none';
                
                if (!username || !password) {
                    errorEl.textContent = 'لطفاً نام کاربری و رمز عبور را وارد کنید';
                    errorEl.style.display = 'block';
                    return;
                }
                
                // RELOAD users from localStorage
                let currentUsers = [];
                try {
                    currentUsers = JSON.parse(localStorage.getItem('ara_users') || '[]');
                } catch(e) {}
                
                // Find user - EXACT MATCH (no hash!)
                const user = currentUsers.find(function(u) {
                    return u.username === username && u.password === password && u.isActive !== false;
                });
                
                if (user) {
                    // SUCCESS!
                    localStorage.setItem('ara_session', JSON.stringify({
                        userId: user.id,
                        username: user.username,
                        role: user.role,
                        expiresAt: new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString()
                    }));
                    
                    window.location.href = '/index.html';
                } else {
                    errorEl.textContent = '❌ نام کاربری یا رمز عبور اشتباه است';
                    errorEl.style.display = 'block';
                }
            });
        })();
    </script>
</body>
</html>
