<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#8B4513">
    <meta name="description" content="تنظیمات کافه ARA Coffee">
    <meta name="robots" content="noindex, nofollow">
    <title>ARA Coffee ☕ - تنظیمات</title>
    <link rel="icon" type="image/x-icon" href="./assets/images/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="./assets/images/favicon.ico">
    <link rel="apple-touch-icon" href="./assets/images/icon-192x192.png">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/settings.css">
</head>
<body data-page="settings">
    <div class="side-nav-overlay" id="side-nav-overlay"></div>
    <div class="app-container">
        <header class="app-header" role="banner">
            <div class="header-left">
                <button class="icon-btn" id="menu-toggle" aria-label="منوی کناری" title="منو"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12h18"/><path d="M3 6h18"/><path d="M3 18h18"/></svg></button>
                <div class="logo-section"><img src="./assets/images/logo-placeholder.png" alt="ARA Coffee" class="logo-img" width="40" height="40" onerror="this.style.display='none'"><h1 class="cafe-name">ARA Coffee</h1></div>
            </div>
            <div class="header-center"><span style="font-weight:600;font-size:1.1rem">🔧 تنظیمات کافه</span></div>
            <div class="header-right">
                <button class="theme-toggle" id="theme-toggle" title="تغییر تم" type="button" aria-label="تغییر تم"><span class="theme-icon">🌙</span></button>
                <div class="user-section"><span class="user-name" id="current-user-display">کاربر</span><div class="user-avatar" id="user-avatar" aria-label="آواتار کاربر">A</div></div>
            </div>
        </header>
        <main class="settings-container">
            <form id="settings-form" autocomplete="off">
                <div class="settings-section"><h2>🏪 اطلاعات کافه</h2>
                    <div class="form-row"><label for="cafe-name">📝 نام کافه</label><input type="text" id="cafe-name" class="form-input" value="ARA Coffee"></div>
                    <div class="form-row"><label for="cafe-address">📍 آدرس</label><textarea id="cafe-address" class="form-input" rows="2"></textarea></div>
                    <div class="form-row"><label for="cafe-phone">📞 تلفن</label><input type="text" id="cafe-phone" class="form-input"></div>
                    <div class="form-row"><label for="cafe-instagram">📸 اینستاگرام</label><input type="text" id="cafe-instagram" class="form-input"></div>
                    <div class="form-row"><label for="cafe-website">🌐 وب‌سایت</label><input type="text" id="cafe-website" class="form-input"></div>
                </div>
                <div class="settings-section"><h2>💰 تنظیمات مالی</h2>
                    <div class="form-row"><label for="currency">💵 واحد پول</label><select id="currency" class="form-input"><option value="تومان">تومان 🇮🇷</option><option value="دلار">دلار 🇺🇸</option></select></div>
                    <div class="form-row"><label for="tax-rate">🧾 نرخ مالیات (%)</label><input type="number" id="tax-rate" class="form-input" value="10" min="0" max="100" step="0.5"></div>
                    <div class="form-row"><label for="discount-percent-setting">🏷️ تخفیف سراسری (%)</label><input type="number" id="discount-percent-setting" class="form-input" value="0" min="0" max="100" step="0.5"></div>
                </div>
                <div class="settings-section"><h2>🖨️ چاپگر</h2>
                    <div class="form-row"><label for="printer-type">📏 اندازه چاپگر</label><select id="printer-type" class="form-input"><option value="58mm">58mm</option><option value="80mm">80mm</option></select></div>
                </div>
                <div class="settings-section"><h2>👤 مدیریت کاربران</h2>
                    <div id="users-list-settings" style="margin-bottom:16px"></div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap">
                        <input type="text" id="new-username" class="form-input" placeholder="نام کاربری جدید" style="flex:1;min-width:150px">
                        <input type="password" id="new-password" class="form-input" placeholder="رمز عبور جدید" style="flex:1;min-width:150px">
                        <select id="new-role" class="form-input" style="width:auto"><option value="admin">👑 مدیر</option><option value="cashier">💼 صندوق‌دار</option></select>
                        <button type="button" class="btn-primary" id="add-user-btn-settings">➕ افزودن کاربر</button>
                    </div>
                </div>
                <div class="settings-section"><h2>🔗 تنظیمات GitHub</h2>
                    <div class="form-row"><label for="github-owner">👤 نام کاربری</label><input type="text" id="github-owner" class="form-input" placeholder="alikarami28"></div>
                    <div class="form-row"><label for="github-repo">📁 نام مخزن</label><input type="text" id="github-repo" class="form-input" value="ARA-Coffee-POS"></div>
                    <div class="form-row"><label for="github-branch">🌿 برنچ</label><input type="text" id="github-branch" class="form-input" value="main"></div>
                    <div class="form-row"><label for="github-token">🔑 توکن دسترسی</label><input type="password" id="github-token" class="form-input"></div>
                    <div class="button-row"><button type="button" class="btn-secondary" id="btn-test-github">🔍 تست اتصال</button><button type="button" class="btn-primary" id="btn-sync-github">🔄 همگام‌سازی</button></div>
                </div>
                <div class="settings-section"><h2>💾 بکاپ</h2>
                    <div class="button-row"><button type="button" class="btn-primary" id="btn-export-backup">📥 دانلود بکاپ</button><button type="button" class="btn-secondary" id="btn-import-backup">📤 بازیابی</button><input type="file" id="import-file" accept=".json" style="display:none"></div>
                </div>
                <button type="submit" class="btn-primary btn-block">💾 ذخیره تمام تنظیمات</button>
            </form>
        </main>
        <nav class="side-nav" id="side-nav" aria-label="منوی اصلی">
            <div class="nav-header"><img src="./assets/images/logo-placeholder.png" alt="ARA Coffee" class="nav-logo" width="80" height="80" onerror="this.style.display='none'"><h3>ARA Coffee ☕</h3><p class="nav-subtitle">سیستم مدیریت کافه</p></div>
            <ul class="nav-links">
    <li><a href="./index.html" class="nav-link"><span>🛒</span> صندوق فروش</a></li>
    <li class="admin-only"><a href="./orders.html" class="nav-link"><span>📋</span> تاریخچه سفارشات</a></li>
    <li class="admin-only"><a href="./admin.html" class="nav-link"><span>⚙️</span> مدیریت محصولات</a></li>
    <li class="admin-only"><a href="./reports.html" class="nav-link active"><span>📊</span> گزارشات</a></li>
    <li class="admin-only"><a href="./settings.html" class="nav-link"><span>🔧</span> تنظیمات</a></li>
    <li><a href="./menu.html" class="nav-link" target="_blank"><span>🍽️</span> منوی کافه</a></li>
            </ul>
            <div class="nav-footer"><p class="version">نسخه 1.0.0</p><button class="btn-logout" id="logout-btn">🚪 خروج</button></div>
        </nav>
    </div>
    <div class="toast-container" id="toast-container" aria-live="polite"></div>
    <script src="./js/github-db.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/settings.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
