<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#8B4513">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ARA Coffee ☕ - تنظیمات</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/settings.css">
    <link rel="icon" type="image/png" href="/assets/images/icon-192x192.png">
    <link rel="apple-touch-icon" href="/assets/images/icon-192x192.png">
</head>
<body data-page="settings">
    <div class="side-nav-overlay" id="side-nav-overlay"></div>
    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <button class="icon-btn" id="menu-toggle" aria-label="منو" title="منو">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18"/><path d="M3 6h18"/><path d="M3 18h18"/></svg>
                </button>
                <div class="logo-section">
                    <img src="/assets/images/logo-placeholder.png" alt="ARA Coffee" class="logo-img"
                         onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22><rect fill=%22%238B4513%22 width=%2240%22 height=%2240%22 rx=%2220%22/><text fill=%22white%22 x=%2250%25%22 y=%2255%25%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2220%22>☕</text></svg>'">
                    <h1 class="cafe-name">ARA Coffee</h1>
                </div>
            </div>
            <div class="header-center"><span style="font-weight:600;font-size:1.1rem;">🔧 تنظیمات کافه</span></div>
            <div class="header-right">
                <button class="theme-toggle" id="theme-toggle" title="تغییر تم" type="button"><span class="theme-icon">🌙</span></button>
                <div class="user-section"><span class="user-name" id="current-user-display">کاربر</span><div class="user-avatar" id="user-avatar">A</div></div>
            </div>
        </header>
        <main class="settings-container">
            <form id="settings-form">
                <div class="settings-section">
                    <h2>🏪 اطلاعات کافه</h2>
                    <div class="form-row"><label for="cafe-name">نام کافه</label><input type="text" id="cafe-name" class="form-input" value="ARA Coffee"></div>
                    <div class="form-row"><label for="cafe-address">آدرس</label><input type="text" id="cafe-address" class="form-input"></div>
                    <div class="form-row"><label for="cafe-phone">تلفن</label><input type="text" id="cafe-phone" class="form-input"></div>
                </div>
                <div class="settings-section">
                    <h2>💰 تنظیمات مالی</h2>
                    <div class="form-row"><label for="currency">واحد پول</label><select id="currency" class="form-input"><option value="تومان">تومان</option><option value="دلار">دلار</option></select></div>
                    <div class="form-row"><label for="tax-rate">نرخ مالیات (%)</label><input type="number" id="tax-rate" class="form-input" value="9" min="0" max="100"></div>
                </div>
                <div class="settings-section">
                    <h2>🖨️ چاپگر</h2>
                    <div class="form-row"><label for="printer-type">نوع چاپگر</label><select id="printer-type" class="form-input"><option value="58mm">58mm</option><option value="80mm">80mm</option></select></div>
                </div>
                <div class="settings-section">
                    <h2>💾 بکاپ و بازیابی</h2>
                    <div class="button-row">
                        <button type="button" class="btn-primary" id="btn-export-backup">📥 دانلود بکاپ</button>
                        <button type="button" class="btn-secondary" id="btn-import-backup">📤 بازیابی بکاپ</button>
                        <input type="file" id="import-file" accept=".json" style="display:none">
                    </div>
                </div>
                <button type="submit" class="btn-primary btn-block">💾 ذخیره تنظیمات</button>
            </form>
        </main>
        <nav class="side-nav" id="side-nav">
            <div class="nav-header">
                <img src="/assets/images/logo-placeholder.png" alt="ARA Coffee" class="nav-logo"
                     onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22><rect fill=%22%238B4513%22 width=%2280%22 height=%2280%22 rx=%2240%22/><text fill=%22white%22 x=%2250%25%22 y=%2255%25%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2240%22>☕</text></svg>'">
                <h3>ARA Coffee ☕</h3><p class="nav-subtitle">سیستم مدیریت کافه</p>
            </div>
            <ul class="nav-links">
                <li><a href="/index.html" class="nav-link"><span>🛒</span> صندوق فروش</a></li>
                <li><a href="/orders.html" class="nav-link"><span>📋</span> تاریخچه سفارشات</a></li>
                <li><a href="/admin.html" class="nav-link"><span>⚙️</span> مدیریت محصولات</a></li>
                <li><a href="/reports.html" class="nav-link"><span>📊</span> گزارشات</a></li>
                <li><a href="/settings.html" class="nav-link active"><span>🔧</span> تنظیمات</a></li>
            </ul>
            <div class="nav-footer"><p class="version">نسخه 1.0.0</p><button class="btn-logout" id="logout-btn">🚪 خروج</button></div>
        </nav>
    </div>
    <div class="toast-container" id="toast-container"></div>
    <script src="/js/storage.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/backup.js"></script>
    <script src="/js/settings.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
